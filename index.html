<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f8dce8">

<title>Pure Shine Cleaning Manager</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#ffffff;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

    overflow-x:hidden;
}

.app{
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    background:#ffffff;
}

.header{
    width:100%;
    height:120px;

    padding:
        calc(env(safe-area-inset-top) + 18px)
        24px
        18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:#ffffff;
}

.logo{
    width:72px;
    height:72px;

    object-fit:cover;

    border-radius:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.brand h1{
    font-size:27px;
    font-weight:800;
    color:#171722;
}

.brand p{
    margin-top:6px;
    font-size:16px;
    color:#817b84;
}

.settings{
    width:58px;
    height:58px;

    border-radius:50%;

    background:#ffffff;

    box-shadow:
        0 5px 20px rgba(0,0,0,.08);

    font-size:27px;
}

.main{
    width:100%;
    padding:0 24px 110px;
}

.date{
    width:100%;
    min-height:120px;

    border-radius:28px;

    background:#f5cee0;

    padding:22px 26px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.date h2{
    font-size:25px;
    font-weight:800;
}

.date p{
    margin-top:8px;
    font-size:16px;
    color:#7e747d;
}

.heart{
    font-size:57px;
    color:#d04783;
}

@media(max-width:600px){

    .header{
        height:110px;
        padding-left:22px;
        padding-right:22px;
    }

    .logo{
        width:66px;
        height:66px;
    }

    .brand{
        gap:12px;
    }

    .brand h1{
        font-size:23px;
    }

    .brand p{
        font-size:14px;
    }

    .settings{
        width:54px;
        height:54px;
        font-size:24px;
    }

    .main{
        padding-left:22px;
        padding-right:22px;
    }

    .date{
        min-height:110px;
        padding:20px;
    }

    .date h2{
        font-size:21px;
    }

    .date p{
        font-size:14px;
    }

    .heart{
        font-size:48px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <img
                src="images/logo.png"
                class="logo"
                alt="Pure Shine Cleaning Manager"
            >

            <div>
                <h1>Cleaning Manager</h1>
                <p>Your cleaning business ✨</p>
            </div>

        </div>

        <button class="settings">
            ⚙️
        </button>

    </header>


    <main class="main">

        <section class="date">

            <div>
                <h2 id="date"></h2>
                <p>Let's make today productive 🌸</p>
            </div>

            <div class="heart">♡</div>

        </section>

    </main>

</div>


<script>

const now = new Date();

const days = [
    "Sunday",
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday"
];

const months = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
];

document.getElementById("date").textContent =
    days[now.getDay()] +
    " " +
    now.getDate() +
    " " +
    months[now.getMonth()];

</script>

</body>
</html>
