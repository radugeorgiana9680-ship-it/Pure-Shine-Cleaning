<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7dbe7">
<title>Pure Shine Cleaning Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Parisienne&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --pink: #d96f9a;
  --pink2: #f5d8e5;
  --pink3: #fff5f9;
  --rose: #9b5975;
  --ink: #25232a;
  --muted: #8f8990;
  --line: #edd4df;
  --blue: #dce9fa;
  --green: #dff2e9;
  --yellow: #fff0c7;
  --purple: #e9ddf7;
  --peach: #f5ddd8;
  --scale: 1.25;
  --bottom: 94px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #fff8fb;
  color: var(--ink);
  font-family: 'DM Sans', Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  overflow-x: hidden;
  font-size: 18px;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
  min-height: 44px;
}

.app {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  background: linear-gradient(#fffafd, #fff);
  padding-bottom: calc(var(--bottom) + env(safe-area-inset-bottom));
  font-size: 1rem;
}

.top {
  padding: 20px 20px 12px;
  background: #fff;
  border-bottom: 1px solid #f2dfe7;
  position: sticky;
  top: 0;
  z-index: 20;
}

.toprow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  max-width: 1100px;
  margin: auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.profile {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #f2d4e1;
  box-shadow: 0 4px 16px #d9a5b633;
  flex: none;
  background: #fff;
}

.brandtext {
  min-width: 0;
}

.brandname {
  font-family: Parisienne, cursive;
  color: #9e5976;
  font-size: clamp(32px, 4.8vw, 52px);
  line-height: 1;
}

.subtitle {
  font-size: 15px;
  color: var(--muted);
  margin-top: 5px;
}

.top-actions {
  display: flex;
  gap: 10px;
}

.icon-btn {
  width: 56px;
  height: 56px;
  border-radius: 18px;
  background: #fbe5ef;
  color: var(--rose);
  font-size: 25px;
  box-shadow: 0 5px 15px #d99ab21c;
}

.icon-btn.active {
  background: var(--pink);
  color: #fff;
}

.page {
  display: none;
  max-width: 1100px;
  margin: auto;
  padding: 20px 20px 36px;
}

.page.active {
  display: block;
}

.date-card {
  background: linear-gradient(135deg, #f9e4ed, #fff9fc);
  border: 1px solid var(--line);
  border-radius: 25px;
  padding: 25px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 2px 0 16px;
}

.date-title {
  font-size: clamp(23px, 3vw, 34px);
  font-weight: 800;
  color: #9e5976;
}

.date-sub {
  color: var(--muted);
  font-size: 16px;
  margin-top: 5px;
}

.heart {
  font-size: 42px;
  color: #a45d79;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 22px;
}

.stat {
  border: 1px solid var(--line);
  border-radius: 22px;
  background: #fff;
  padding: 18px 14px;
  min-height: 118px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.stat:nth-child(1) {
  background: #f4dbe8;
}

.stat:nth-child(2) {
  background: #dce9fa;
}

.stat:nth-child(3) {
  background: #ddf1e8;
}

.stat:nth-child(4) {
  background: #fff0c8;
}

.stat-icon {
  font-size: 28px;
  margin-bottom: 7px;
}

.stat-value {
  font-size: 26px;
  font-weight: 800;
}

.stat-label {
  font-size: 14px;
  color: #68636a;
  margin-top: 4px;
}

.section-title {
  font-size: 24px;
  font-weight: 800;
  margin: 22px 2px 12px;
}

.seeall {
  float: right;
  font-size: 15px;
  color: #9b5975;
  margin-top: 5px;
  cursor: pointer;
}

.schedule-box {
  background: #fff;
  border-radius: 25px;
  padding: 12px;
  border: 1px solid #f0dce5;
  box-shadow: 0 8px 25px #b96d8b0d;
}

.job-card {
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 19px;
  margin-bottom: 10px;
  background: #fff;
}

.job-head {
  display: flex;
  justify-content: space-between;
  gap: 15px;
}

.job-name {
  font-size: 21px;
  font-weight: 800;
}

.job-time {
  font-size: 20px;
  font-weight: 800;
  color: #9b5975;
  white-space: nowrap;
}

.job-meta {
  font-size: 15px;
  color: var(--muted);
  margin-top: 6px;
}

.job-money {
  font-size: 17px;
  color: #858087;
  margin-top: 14px;
}

.job-money strong {
  color: #9b5975;
}

.job-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.btn {
  padding: 12px 15px;
  border-radius: 13px;
  font-weight: 700;
  background: #f7e8ef;
  color: #955873;
}

.btn.primary {
  background: var(--pink);
  color: #fff;
}

.btn.pdf {
  background: #f8ecd4;
  color: #8b7045;
}

.btn.paid {
  background: #dcefe5;
  color: #397459;
}

.btn.unpaid {
  background: #eee;
  color: #777;
}

.add-job {
  width: 100%;
  margin-top: 5px;
  padding: 16px;
  border-radius: 18px;
  background: var(--pink);
  color: #fff;
  font-weight: 800;
  font-size: 18px;
}

.quick-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.quick {
  min-height: 78px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  font-weight: 700;
  font-size: 17px;
  color: #45607d;
}

.quick.blue {
  background: var(--blue);
}

.quick.green {
  background: var(--green);
  color: #4e7868;
}

.quick.pink {
  background: #f2d9e5;
  color: #8d5871;
}

.quick.yellow {
  background: var(--yellow);
  color: #8d7444;
}

.quick.purple {
  background: var(--purple);
  color: #76588c;
}

.quick.peach {
  background: var(--peach);
  color: #946358;
}

.banner {
  width: 100%;
  height: auto;
  max-height: 260px;
  object-fit: contain;
  border-radius: 22px;
  margin-top: 18px;
  display: block;
}

.fab {
  position: fixed;
  right: 24px;
  bottom: calc(var(--bottom) + 22px);
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--pink);
  color: #fff;
  font-size: 36px;
  box-shadow: 0 8px 24px #b968882e;
  z-index: 35;
}

.bottom {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: var(--bottom);
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: #fff;
  box-shadow: 0 -5px 25px #c7819a18;
  z-index: 30;
}

.nav {
  height: 100%;
  max-width: 1100px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
}

.nav button {
  background: transparent;
  color: #8e8990;
  border-radius: 19px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 14px;
}

.nav button .nav-icon {
  font-size: 27px;
  line-height: 1;
}

.nav button.active {
  background: #f8dfeb;
  color: #9b5975;
  font-weight: 800;
}

.settings-list {
  display: grid;
  gap: 10px;
}

.settings-section {
  font-size: 15px;
  letter-spacing: .08em;
  color: #98617a;
  font-weight: 800;
  margin: 18px 3px 3px;
  text-transform: uppercase;
}

.setting {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 13px;
  min-height: 76px;
}

.setting-icon {
  width: 48px;
  height: 48px;
  border-radius: 15px;
  background: #f9e3ed;
  display: grid;
  place-items: center;
  font-size: 25px;
  flex: none;
}

.setting-main {
  flex: 1;
  min-width: 0;
}

.setting-title {
  font-weight: 800;
  font-size: 18px;
}

.setting-desc {
  color: var(--muted);
  font-size: 14px;
  margin-top: 4px;
}

.setting-control {
  flex: none;
}

.select,
.text-input {
  border: 0;
  background: #fff2f7;
  color: #955873;
  border-radius: 12px;
  padding: 11px 12px;
  font-weight: 700;
  max-width: 150px;
}

.switch {
  width: 58px;
  height: 34px;
  background: #ddd;
  border-radius: 20px;
  padding: 3px;
  transition: .2s;
}

.switch i {
  display: block;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #fff;
  transition: .2s;
  box-shadow: 0 1px 4px #0002;
}

.switch.on {
  background: var(--pink);
}

.switch.on i {
  transform: translateX(24px);
}

.save-all {
  width: 100%;
  padding: 16px;
  border-radius: 17px;
  background: var(--pink);
  color: #fff;
  font-weight: 800;
  margin-top: 12px;
  font-size: 18px;
}

.page-title {
  font-size: 30px;
  font-weight: 800;
  color: #9b5975;
  margin: 6px 0 16px;
}

.empty {
  background: #fff;
  border: 1px dashed var(--line);
  border-radius: 22px;
  padding: 30px;
  text-align: center;
  color: var(--muted);
}

.list {
  display: grid;
  gap: 10px;
}

.client {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #f5dce7;
  color: #9b5975;
  display: grid;
  place-items: center;
  font-weight: 800;
}

.client-info {
  flex: 1;
}

.client-name {
  font-weight: 800;
  font-size: 18px;
}

.client-sub {
  font-size: 14px;
  color: var(--muted);
  margin-top: 3px;
}

.rate {
  font-weight: 800;
  color: #9b5975;
}

.toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.toolbar .btn {
  flex: 1;
  min-width: 110px;
}

.earning-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.earning-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px;
}

.earning-card b {
  font-size: 22px;
  color: #9b5975;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.day {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 3px;
  min-height: 65px;
  text-align: center;
  font-size: 13px;
}

.day strong {
  display: block;
  font-size: 15px;
}

.day.has {
  background: #f8e2eb;
}

.modal-back {
  position: fixed;
  inset: 0;
  background: #1f152066;
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.modal-back.show {
  display: flex;
}

.modal {
  background: #fff;
  width: min(100%, 650px);
  max-height: 90dvh;
  overflow: auto;
  border-radius: 28px 28px 0 0;
  padding: 20px;
}

.modal h2 {
  margin: 0 0 15px;
  color: #9b5975;
}

.form {
  display: grid;
  gap: 10px;
}

.form label {
  font-size: 14px;
  color: #777;
  font-weight: 700;
}

.form input,
.form select,
.form textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fff;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.modal-actions button {
  flex: 1;
}

/* Zoom and timer styles continue in the next part. */
</style>
